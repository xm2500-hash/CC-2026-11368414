
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Nocturne — Nana Ouyang
  </title>

  <!-- p5.js -->
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js"></script>

  <!-- p5.sound -->
  <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>

  <style>

    /* --------------------------------
       PAGE
    -------------------------------- */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #101020;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    /* --------------------------------
       MUSIC BUTTON
    -------------------------------- */

    .music-button {
      background: rgba(65, 48, 90, 0.75);
      color: #efd9ff;

      border: 1px solid #9878bd;
      border-radius: 25px;

      font-family: Arial, sans-serif;
      font-size: 13px;
      letter-spacing: 0.3px;

      cursor: pointer;

      transition:
        background 0.2s ease,
        border-color 0.2s ease;
    }

    .music-button:hover {
      background: rgba(115, 80, 150, 0.85);
      border-color: #d5b0ff;
    }

    .music-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    /* --------------------------------
       CONTROL PANEL
    -------------------------------- */

    .control-panel {
      position: absolute;

      left: 25px;
      bottom: 25px;

      width: 250px;
      padding: 20px;

      background: rgba(32, 25, 52, 0.8);

      border: 1px solid
        rgba(190, 155, 235, 0.25);

      border-radius: 16px;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      color: #ead9ff;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.15);
    }

    /* --------------------------------
       CONTROL GROUP
    -------------------------------- */

    .control-group {
      margin-bottom: 22px;
    }

    .control-group:last-child {
      margin-bottom: 0;
    }

    /* --------------------------------
       CONTROL LABEL
    -------------------------------- */

    .control-label {
      font-family: Arial, sans-serif;
      font-size: 12px;

      font-weight: 400;
      letter-spacing: 1.5px;

      color: #e9d5ff;

      margin-bottom: 12px;
    }

    /* --------------------------------
       SLIDERS
    -------------------------------- */

    .music-slider {
      display: block;

      width: 100%;
      height: 6px;

      margin: 0;

      accent-color: #c6a3ef;

      cursor: pointer;
    }

    .music-slider:hover {
      accent-color: #e3b5f5;
    }

   

    @media (max-width: 600px) {

      .control-panel {
        left: 15px;
        bottom: 15px;

        width: 200px;
        padding: 15px;
      }

      .music-button {
        font-size: 12px;
      }

    }

  </style>
</head>

<body>

  <!-- Main p5.js sketch -->
  <script src="sketch.js"></script>

</body>

</html>
